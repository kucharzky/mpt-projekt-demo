name: smartuniplanner-production

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardened: &hardened
  init: true
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging: *logging
  pids_limit: 128
  stop_grace_period: 45s

services:
  storage-init:
    image: postgres:18.6-bookworm
    user: "0:0"
    restart: "no"
    network_mode: none
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    entrypoint: [sh, -c]
    command:
      [
        "chown 1000:1000 /data /config && chmod 700 /data /config && chown 999:999 /repository && chmod 700 /repository",
      ]
    volumes: [caddy_data:/data, caddy_config:/config, backup_data:/repository]
    read_only: true
    logging: *logging

  caddy:
    <<: *hardened
    image: caddy:2.11.8-alpine
    # Ports inside the container avoid privileged capabilities entirely.
    user: "1000:1000"
    ports: ["80:8080", "443:8443", "443:8443/udp"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in deploy/.env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    command: [caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    networks:
      proxy:
        ipv4_address: 172.30.91.2
    depends_on:
      api: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
    mem_limit: 256m

  migrate:
    <<: *hardened
    restart: "no"
    image: smartuniplanner-migrate:${APP_IMAGE_TAG:-local}
    build: { context: ., target: migration }
    environment:
      DATABASE_URL: ${MIGRATOR_DATABASE_URL:?Generate production configuration}
    command: [node, apps/api/scripts/migrate.cjs]
    networks: [database]
    depends_on:
      postgres: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,size=64m"]
    mem_limit: 512m

  api:
    <<: *hardened
    image: smartuniplanner-api:${APP_IMAGE_TAG:-local}
    build: { context: ., target: production }
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3001
      APP_ORIGIN: https://${APP_DOMAIN}
      DATABASE_URL: ${APP_DATABASE_URL:?Generate production configuration}
      SESSION_SECRET: ${SESSION_SECRET:?Generate production configuration}
      REGISTRATION_CODE: ${REGISTRATION_CODE:?Generate production configuration}
      TRUSTED_PROXIES: 172.30.91.2/32
      NODE_OPTIONS: --max-old-space-size=384
    # API and database have no host ports. Caddy is the only public entry point.
    networks: [proxy, database]
    depends_on:
      migrate: { condition: service_completed_successfully }
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    mem_limit: 768m
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    init: true
    image: postgres:18.6-bookworm
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: *logging
    environment:
      POSTGRES_DB: smartuniplanner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Generate production configuration}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?Generate production configuration}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Generate production configuration}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:?Generate production configuration}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    networks: [database]
    shm_size: 128m
    mem_limit: 768m
    pids_limit: 128
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d smartuniplanner"]
      interval: 5s
      timeout: 5s
      retries: 12

  backup:
    <<: *hardened
    image: smartuniplanner-backup:${APP_IMAGE_TAG:-local}
    build: { context: ., dockerfile: deploy/backup.Dockerfile }
    environment:
      PGHOST: postgres
      PGUSER: smartuni_backup
      PGDATABASE: smartuniplanner
      PGPASSWORD: ${BACKUP_DB_PASSWORD:?Generate production configuration}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?Generate production configuration}
      RESTIC_REPOSITORY: /repository
    volumes: [backup_data:/repository]
    networks: [database]
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=128m"]
    mem_limit: 384m
    healthcheck:
      test:
        [
          CMD-SHELL,
          "test -f /tmp/last-success && test $$(($$(date +%s) - $$(cat /tmp/last-success))) -lt 90000",
        ]
      interval: 5m
      timeout: 5s
      retries: 1
      start_period: 10m

networks:
  proxy:
    ipam:
      config: [{ subnet: 172.30.91.0/24, ip_range: 172.30.91.128/25 }]
  database:
    internal: true
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  backup_data:
