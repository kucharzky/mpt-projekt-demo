name: smartuniplanner

x-postgres: &postgres
  image: postgres:18.6-bookworm
  environment: &postgres-environment
    POSTGRES_DB: ${POSTGRES_DB:-smartuniplanner}
    POSTGRES_USER: ${POSTGRES_USER:-smartuniplanner}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
  healthcheck:
    test:
      ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
    interval: 5s
    timeout: 5s
    retries: 12
    start_period: 10s

services:
  web:
    profiles: [app]
    build:
      context: .
      target: development
    environment:
      API_PROXY_TARGET: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    volumes:
      - type: bind
        source: ./apps/web/src
        target: /app/apps/web/src
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./apps/web/index.html
        target: /app/apps/web/index.html
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./apps/web/vite.config.ts
        target: /app/apps/web/vite.config.ts
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    profiles: [app]
    build:
      context: .
      target: migration
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-smartuniplanner}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smartuniplanner}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: [app]
    build:
      context: .
      target: api-development
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-smartuniplanner}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smartuniplanner}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-local_development_only_change_before_production_64_characters}
      APP_ORIGIN: http://localhost:${WEB_PORT:-5173}
      API_PORT: 3001
      API_HOST: 0.0.0.0
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    volumes:
      - type: bind
        source: ./apps/api/src
        target: /app/apps/api/src
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  postgres:
    <<: *postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ keeps its version-specific PGDATA under this directory.
      - postgres_data:/var/lib/postgresql

  postgres-test:
    <<: *postgres
    profiles: [test]
    restart: "no"
    environment:
      <<: *postgres-environment
      POSTGRES_DB: ${POSTGRES_TEST_DB:-smartuniplanner_test}
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432"
    # Test data is disposable and never shares the development volume.
    tmpfs:
      - /var/lib/postgresql

volumes:
  postgres_data:
